<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <title>Вход · reader3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600&display=swap">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/js/common.js"></script>
  <style>
    body { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
    .login { width: min(380px, 100%); text-align: center; }
    .mark { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 18px; background: var(--accent); color: var(--accent-text); margin-bottom: 18px; box-shadow: var(--shadow); }
    .mark .icon { width: 32px; height: 32px; }
    h1 { font: 600 26px/1.2 var(--font-serif); margin: 0 0 6px; letter-spacing: -.01em; }
    p { color: var(--muted); margin: 0 0 24px; }
    form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
    .input { height: 48px; font-size: 16px; padding: 0 14px; }
    .btn { height: 48px; font-size: 15px; }
    .error { color: #d0453a; font-size: 14px; text-align: center; margin: 0; }
  </style>
</head>
<body>
  <main class="login">
    <div class="mark"><i data-icon="book"></i></div>
    <h1>reader3</h1>
    <p>Введите пароль, чтобы открыть библиотеку</p>
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <input class="input" type="password" name="password" placeholder="Пароль" autocomplete="current-password" autofocus required aria-label="Пароль">
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <button class="btn primary" type="submit">Войти</button>
    </form>
  </main>
  <script>hydrateIcons();</script>
</body>
</html>
